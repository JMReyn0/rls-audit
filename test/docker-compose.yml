name: rls-audit-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rlsaudit
    ports:
      - "55432:5432"
    volumes:
      - ./fixtures/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rlsaudit"]
      interval: 2s
      timeout: 3s
      retries: 30
